<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MR · Minha Rotina</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3D4F3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MR">
  <style>
    :root {
      --bg: #F7F3EC;
      --card: #FFFFFF;
      --text: #2C2A26;
      --muted: #8A847A;
      --green: #3D4F3A;
      --green-soft: #5A6B56;
      --accent: #C9A882;
      --border: #EDE6DC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
    }
    header { padding: 28px 20px 16px; text-align: center; }
    .logo { font-family: "Didot", "Bodoni MT", "Playfair Display", Georgia, serif; font-size: 2.4rem; font-weight: 400; letter-spacing: 2px; color: var(--green); }
    .logo-sub { font-size: 0.7rem; letter-spacing: 3px; color: var(--muted); margin-top: 2px; }
    .date { margin-top: 12px; font-size: 0.9rem; color: var(--muted); }
    .progress-wrap { margin: 16px 20px 0; height: 4px; background: #E8E0D6; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.4s ease; }
    .verse-card { margin: 20px 20px 8px; background: white; border-radius: 18px; padding: 22px 20px; text-align: center; box-shadow: 0 4px 20px rgba(61,79,58,0.06); border: 1px solid var(--border); }
    .verse-label { font-size: 0.65rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--green-soft); margin-bottom: 10px; }
    .verse-text { font-family: Georgia, serif; font-size: 1.15rem; font-style: italic; line-height: 1.55; }
    .verse-ref { margin-top: 10px; font-size: 0.75rem; color: var(--muted); }
    .info-cards { display: flex; gap: 10px; margin: 12px 20px 20px; }
    .info-card { flex: 1; background: white; border-radius: 14px; padding: 14px 12px; text-align: center; border: 1px solid var(--border); }
    .info-card h4 { font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .info-card p { font-size: 0.85rem; color: var(--green); font-weight: 500; }
    .section { display: none; padding: 0 20px; }
    .section.active { display: block; }
    .task { background: white; border-radius: 16px; padding: 16px 16px 16px 14px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--border); position: relative; }
    .task::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--green); }
    .task.espiritual::before { background: #C9A882; }
    .task.criancas::before { background: #E8B4A0; }
    .task.casa::before { background: #8FA67A; }
    .task.alimentacao::before { background: #D4B896; }
    .task.pessoal::before { background: #7A9BB5; }
    .task.lazer::before { background: #B8A0C8; }
    .task.current { box-shadow: 0 0 0 2px var(--green); }
    .task.done { opacity: 0.5; }
    .task.done .task-title { text-decoration: line-through; }
    input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--green); flex-shrink: 0; }
    .task-time { font-size: 0.75rem; font-weight: 600; color: var(--green); min-width: 46px; }
    .task-body { flex: 1; }
    .task-title { font-weight: 500; font-size: 0.95rem; }
    .task-desc { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .edit-controls { display: none; margin: 8px 0; }
    .edit-mode .edit-controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .edit-mode .task-title, .edit-mode .task-time { display: none; }
    .edit-input { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.9rem; width: 100%; }
    .edit-input.time { width: 80px; }
    .btn-small { background: var(--green); color: white; border: none; border-radius: 8px; padding: 6px 12px; font-size: 0.75rem; cursor: pointer; }
    .btn-small.danger { background: #C45C5C; }
    .top-actions { display: flex; justify-content: center; gap: 10px; margin: 10px 20px; }
    .top-actions button { background: white; border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px; font-size: 0.85rem; cursor: pointer; }
    .top-actions button.active { background: var(--green); color: white; border-color: var(--green); }
    nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--green); display: flex; padding: 10px 0 18px; border-radius: 20px 20px 0 0; z-index: 100; }
    nav.bottom-nav button { flex: 1; background: none; border: none; color: rgba(255,255,255,0.6); font-size: 0.65rem; letter-spacing: 0.5px; padding: 6px 0; cursor: pointer; }
    nav.bottom-nav button.active { color: white; }
    nav.bottom-nav button span { display: block; font-size: 1.3rem; margin-bottom: 2px; }
    .reset-btn { display: block; margin: 30px auto 20px; padding: 14px 32px; background: var(--green); color: white; border: none; border-radius: 30px; font-size: 0.9rem; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="logo">MR</div>
    <div class="logo-sub">MINHA ROTINA</div>
    <div class="date" id="currentDate"></div>
  </header>
  <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>

  <div class="top-actions">
    <button id="btnEdit" onclick="toggleEdit()">Editar rotina</button>
    <button id="btnAdd" onclick="addTask()" style="display:none">+ Adicionar</button>
  </div>

  <div id="rotina" class="section active"></div>
  <div id="criancas" class="section"></div>
  <div id="casa" class="section"></div>

  <button class="reset-btn" onclick="resetToday()">Reiniciar o dia</button>

  <nav class="bottom-nav">
    <button class="active" data-tab="rotina"><span>🏠</span>ROTINA</button>
    <button data-tab="criancas"><span>👧</span>CRIANÇAS</button>
    <button data-tab="casa"><span>🏡</span>CASA</button>
  </nav>

  <script>
    const today = new Date();
    document.getElementById('currentDate').textContent = today.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^./, c => c.toUpperCase());

    const dayIndex = today.getDay();
    const zones = { 1: 'Sala e Cozinha', 2: 'Banheiros e Lavanderia', 3: 'Quartos', 4: 'Entrada e áreas comuns', 5: 'Manutenção geral' };
    const focuses = { 1: 'Estudo (Mestrado)', 2: 'Trabalho (Agência)', 3: 'Pesquisa', 4: 'Trabalho (Agência)', 5: 'Estudo (Mestrado)', 6: 'Família e Lazer', 0: 'Meal Prep + Descanso' };
    const currentZone = zones[dayIndex] || 'Flexível';
    const currentFocus = focuses[dayIndex] || 'Livre';

    const verses = [
      { text: "O Senhor é o meu pastor; nada me faltará.", ref: "Salmos 23:1" },
      { text: "Posso todas as coisas naquele que me fortalece.", ref: "Filipenses 4:13" },
      { text: "Mas os que esperam no Senhor renovarão as suas forças.", ref: "Isaías 40:31" },
      { text: "Confia no Senhor de todo o teu coração.", ref: "Provérbios 3:5" },
      { text: "Não temas, porque eu sou contigo.", ref: "Isaías 41:10" },
      { text: "Deus é o nosso refúgio e fortaleza.", ref: "Salmos 46:1" },
      { text: "As misericórdias do Senhor renovam-se cada manhã.", ref: "Lamentações 3:22-23" },
      { text: "Lancem sobre ele toda a sua ansiedade.", ref: "1 Pedro 5:7" },
      { text: "Este é o dia que o Senhor fez.", ref: "Salmos 118:24" },
      { text: "Porque eu bem sei os planos que tenho para vocês.", ref: "Jeremias 29:11" }
    ];
    const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
    const verseOfDay = verses[dayOfYear % verses.length];

    const defaultRoutine = [
      { time: '06:00', title: 'Acordar e Ler a Bíblia', desc: 'Começar o dia com Deus', cat: 'espiritual' },
      { time: '06:20', title: 'Preparar café das crianças', cat: 'alimentacao' },
      { time: '06:40', title: 'Café da manhã das crianças', cat: 'alimentacao' },
      { time: '07:00', title: 'Meu banho', cat: 'pessoal' },
      { time: '07:20', title: 'Alfabetização com o mais velho', cat: 'criancas' },
      { time: '07:50', title: 'Alfabetização com o do meio', cat: 'criancas' },
      { time: '08:20', title: 'Momento de lazer juntos', cat: 'lazer' },
      { time: '09:00', title: 'Rotina da casa', desc: 'Zona: ' + currentZone, cat: 'casa' },
      { time: '10:00', title: 'Começar a preparar o almoço', cat: 'alimentacao' },
      { time: '11:30', title: 'Almoço da família', cat: 'alimentacao' },
      { time: '12:15', title: 'Levar para a escola', cat: 'criancas' },
      { time: '13:00', title: 'Foco da tarde: ' + currentFocus, cat: 'pessoal' },
      { time: '18:00', title: 'Chegar em casa', cat: 'criancas' },
      { time: '18:15', title: 'Jantar', cat: 'alimentacao' },
      { time: '18:45', title: 'Banho das crianças', cat: 'criancas' },
      { time: '19:15', title: 'Devocional', cat: 'espiritual' },
      { time: '19:45', title: 'Escovar dentes e dormir', cat: 'criancas' },
      { time: '20:15', title: 'Crianças dormindo', cat: 'pessoal' }
    ];

    let routine = JSON.parse(localStorage.getItem('customRoutine')) || defaultRoutine;
    let editMode = false;

    const criancas = [
      { title: 'Escovar dentes (manhã)', cat: 'criancas' },
      { title: 'Escovar dentes (noite)', cat: 'criancas' },
      { title: 'Café da manhã', cat: 'alimentacao' },
      { title: 'Almoço', cat: 'alimentacao' },
      { title: 'Lanche', cat: 'alimentacao' },
      { title: 'Jantar', cat: 'alimentacao' },
      { title: 'Alfabetização', cat: 'criancas' },
      { title: 'Devocional', cat: 'espiritual' },
      { title: 'Lazer', cat: 'lazer' },
      { title: 'Escola', cat: 'criancas' },
      { title: 'Dormir cedo', cat: 'criancas' }
    ];

    const casa = [
      { title: 'Pia limpa', cat: 'casa' },
      { title: 'Lixo tirado', cat: 'casa' },
      { title: 'Roupas organizadas', cat: 'casa' },
      { title: 'Camas arrumadas', cat: 'casa' },
      { title: 'Eu tomei banho', cat: 'pessoal' },
      { title: 'Zona do dia: ' + currentZone, cat: 'casa' }
    ];

    function getStorageKey(section) { return `rotina_${section}_${today.toISOString().split('T')[0]}`; }
    function loadState(section) { const raw = localStorage.getItem(getStorageKey(section)); return raw ? JSON.parse(raw) : {}; }
    function saveState(section, state) { localStorage.setItem(getStorageKey(section), JSON.stringify(state)); }

    function renderSection(containerId, items, sectionKey, hasTime = false) {
      const container = document.getElementById(containerId);
      const state = loadState(sectionKey);
      let html = '';

      if (sectionKey === 'rotina') {
        html += `
          <div class="verse-card">
            <div class="verse-label">Versículo do Dia</div>
            <div class="verse-text">“${verseOfDay.text}”</div>
            <div class="verse-ref">${verseOfDay.ref}</div>
          </div>
          <div class="info-cards">
            <div class="info-card"><h4>Foco</h4><p>${currentFocus}</p></div>
            <div class="info-card"><h4>Zona</h4><p>${currentZone}</p></div>
          </div>`;
      }

      items.forEach((item, i) => {
        const id = `${sectionKey}_${i}`;
        const checked = state[id] ? 'checked' : '';
        const doneClass = state[id] ? 'done' : '';
        const currentClass = isCurrent(item.time) ? 'current' : '';
        html += `
          <div class="task ${doneClass} ${currentClass} ${item.cat || ''}" data-index="${i}">
            <input type="checkbox" id="${id}" ${checked} onchange="toggleTask('${sectionKey}', '${id}', this.checked)">
            <div class="task-body">
              ${hasTime && item.time ? `<div class="task-time">${item.time}</div>` : ''}
              <div class="task-title">${item.title}</div>
              ${item.desc ? `<div class="task-desc">${item.desc}</div>` : ''}
              ${sectionKey === 'rotina' ? `
                <div class="edit-controls">
                  <input class="edit-input time" type="time" value="${item.time || ''}" onchange="updateTask(${i}, 'time', this.value)">
                  <input class="edit-input" type="text" value="${item.title}" onchange="updateTask(${i}, 'title', this.value)">
                  <button class="btn-small danger" onclick="deleteTask(${i})">Remover</button>
                </div>` : ''}
            </div>
          </div>`;
      });

      container.innerHTML = html;
      updateProgress();
    }

    function isCurrent(timeStr) {
      if (!timeStr) return false;
      const now = new Date();
      const [h, m] = timeStr.split(':').map(Number);
      const taskTime = new Date();
      taskTime.setHours(h, m, 0, 0);
      return now >= taskTime && now < new Date(taskTime.getTime() + 45 * 60000);
    }

    function toggleTask(section, id, checked) {
      const state = loadState(section);
      state[id] = checked;
      saveState(section, state);
      document.getElementById(id).closest('.task').classList.toggle('done', checked);
      updateProgress();
    }

    function updateProgress() {
      const boxes = document.querySelectorAll('#rotina input[type="checkbox"]');
      const pct = boxes.length ? Math.round((document.querySelectorAll('#rotina input:checked').length / boxes.length) * 100) : 0;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function toggleEdit() {
      editMode = !editMode;
      document.body.classList.toggle('edit-mode', editMode);
      document.getElementById('btnEdit').textContent = editMode ? 'Salvar' : 'Editar rotina';
      document.getElementById('btnAdd').style.display = editMode ? 'inline-block' : 'none';
      if (!editMode) {
        localStorage.setItem('customRoutine', JSON.stringify(routine));
      }
      renderSection('rotina', routine, 'rotina', true);
    }

    function updateTask(index, field, value) {
      routine[index][field] = value;
      localStorage.setItem('customRoutine', JSON.stringify(routine));
    }

    function deleteTask(index) {
      if (confirm('Remover esta tarefa?')) {
        routine.splice(index, 1);
        localStorage.setItem('customRoutine', JSON.stringify(routine));
        renderSection('rotina', routine, 'rotina', true);
      }
    }

    function addTask() {
      routine.push({ time: '12:00', title: 'Nova tarefa', cat: 'pessoal' });
      localStorage.setItem('customRoutine', JSON.stringify(routine));
      renderSection('rotina', routine, 'rotina', true);
    }

    function resetToday() {
      if (confirm('Reiniciar todas as tarefas de hoje?')) {
        localStorage.removeItem(getStorageKey('rotina'));
        localStorage.removeItem(getStorageKey('criancas'));
        localStorage.removeItem(getStorageKey('casa'));
        location.reload();
      }
    }

    document.querySelectorAll('.bottom-nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    renderSection('rotina', routine, 'rotina', true);
    renderSection('criancas', criancas, 'criancas');
    renderSection('casa', casa, 'casa');
  </script>
</body>
</html>
